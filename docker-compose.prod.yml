# ZAIEZE — produção (AWS Lightsail, instância única com Docker Compose)
# Sobe: PostgreSQL + API (Fastify) + Web (nginx servindo o SPA e fazendo proxy /api + TLS).
# Variáveis vêm do arquivo .env (veja .env.production.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3050"
    # Persiste os uploads (ex.: logo da marca) entre redeploys/rebuilds.
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # WhatsApp não-oficial (Evolution API v2) — instância por vendedora via QR.
  # INTERNO: acessível só na rede do compose (http://evolution:8080); NÃO exposto na internet.
  # Reusa o Postgres (banco "evolution") e cache local (sem Redis). A API do ZAIEZE fala com
  # ela por dentro (EVOLUTION_API_URL=http://evolution:8080) e recebe webhooks dela.
  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_zaieze
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "60"
      LOG_LEVEL: "ERROR"
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  pgdata:
  uploads:
  evolution_instances:
