# ZAIEZE — produção (AWS Lightsail, instância única com Docker Compose)
# Sobe: PostgreSQL + API (Fastify) + Web (nginx servindo o SPA e fazendo proxy /api + TLS).
# Variáveis vêm do arquivo .env (veja .env.production.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3050"
    # Persiste os uploads (ex.: logo da marca) entre redeploys/rebuilds.
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # WhatsApp: migrado para a Cloud API oficial da Meta (sem container — a API do ZAIEZE
  # fala direto com o Graph). As credenciais (WABA/número) ficam por marca (Rede.wa*).

volumes:
  pgdata:
  uploads:
