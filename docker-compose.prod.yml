# ZAIEZE — produção (AWS Lightsail, instância única com Docker Compose)
# Sobe: PostgreSQL + API (Fastify) + Web (nginx servindo o SPA e fazendo proxy /api + TLS).
# Variáveis vêm do arquivo .env (veja .env.production.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3050"
    # Persiste os uploads (ex.: logo da marca) e as sessões do WhatsApp pessoal (Baileys)
    # entre redeploys/rebuilds.
    volumes:
      - uploads:/app/uploads
      - wa_sessions:/app/wa-sessions

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # WhatsApp: dois canais, ambos sem container à parte — a API do ZAIEZE fala direto com o
  # Graph (Cloud API oficial, credenciais por marca em Rede.wa*) e roda o Baileys embutido no
  # próprio processo (QR Code por vendedora, sessão persistida no volume wa_sessions).

volumes:
  pgdata:
  uploads:
  wa_sessions:
