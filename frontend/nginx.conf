# ZAIEZE — nginx do SPA + proxy /api, com wildcard de tenant (*.zaieze.com)

# HTTP → redireciona tudo para HTTPS
server {
  listen 80;
  server_name zaieze.com *.zaieze.com;
  return 301 https://$host$request_uri;
}

# HTTPS — mesmo SPA para a landing (zaieze.com) e para cada tenant (<slug>.zaieze.com)
server {
  listen 443 ssl;
  http2 on;
  server_name zaieze.com *.zaieze.com;

  # Certificado curinga (Let's Encrypt via DNS-01). Cobre zaieze.com e *.zaieze.com.
  ssl_certificate     /etc/letsencrypt/live/zaieze.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/zaieze.com/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 60m;

  # Cabeçalhos de segurança
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  server_tokens off;

  # API → backend (mantém o prefixo /api que o Fastify espera)
  location /api/ {
    proxy_pass http://api:3050;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets com hash → cache longo
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_types text/css application/javascript image/svg+xml application/json font/otf font/ttf;
}
